# Registro de fuentes: qué fuentes se usan, con qué conector, a qué coste y qué
# hacer si fallan. Cambiar de intermediario (p. ej. LinkedIn de RapidAPI a
# Apify) es cambiar `conector` aquí; el resto del sistema no se entera.
#
# `conector` es la versión exacta: si cambia la interpretación de una fuente,
# cambia la versión, y cada ejecución y cada oferta guardan con cuál se hicieron.
# Decisiones y medidas: docs/arquitectura.md (Fase 1) y docs/modelo.md.

fuentes:
  freehire:
    tipo: agregador
    conector: freehire-api/2
    acceso: API pública sin clave (freehire.me/api/v1)
    coste: gratis
    terminos: Proyecto MIT; API pública documentada en freehire.me/docs/api. Uso moderado, User-Agent identificado.
    frecuencia_h: 24
    mercados: true   # gratis: también vigila el remoto de remoto.mercados (p. ej. el Golfo)
    plan_b:
      - Active Jobs DB (fantastic.jobs), mismo agregado de ATS
      - Autoalojar freehire (MIT)

  infojobs:
    tipo: portal
    conector: infojobs-ats-scrapers/1
    acceso: Listado web con httpcloak, vía el adaptador infojobs_es de ats-scrapers
    coste: gratis
    terminos: Scraping de páginas públicas. Solo búsquedas acotadas, ~4 peticiones al día con pausas largas; con ~8 en 20 minutos salta el captcha.
    frecuencia_h: 24
    plan_b:
      - freehire (incluye InfoJobs, pero el 16-oct su copia iba 9 días por detrás)
      - Emails de alerta de InfoJobs (#10)

  linkedin:
    tipo: api_terceros
    # Decisión (#35 y #40, 16-oct-2026): Apify. Hacen falta ~400-900 ofertas al mes y el
    # plan gratuito de RapidAPI da 250. En el plan gratuito de Apify el actor cuesta
    # 0,005 $ por oferta y 0,01 $ por ejecución, con tope duro de 5 $ al mes: Málaga a
    # diario (~10 ofertas) y remoto semanal (~120) salen por ~4,4 $/mes.
    conector: linkedin-fantastic-apify/1
    acceso: Actor de fantastic.jobs en Apify, token en .env (APIFY_TOKEN)
    coste: Plan gratuito de Apify, 5 $ al mes; el conector no pasa de 4,8 $
    terminos: Términos de Apify y de fantastic.jobs. El scraping de LinkedIn lo hace el proveedor, no nosotros.
    frecuencia_h: 24
    frecuencia_remoto_h: 168
    plan_b:
      - La misma API en RapidAPI (linkedin-fantastic-rapidapi/1; plan gratuito de 250 ofertas al mes)
      - JobSpy con pausas largas
      - Emails de alerta de LinkedIn (#9)

  indeed:
    tipo: portal
    conector: indeed-jobspy/2
    acceso: JobSpy (python-jobspy)
    coste: gratis
    terminos: Scraping de páginas públicas a través de JobSpy. Fuente secundaria, baja frecuencia.
    frecuencia_h: 72
    plan_b:
      - JSearch (RapidAPI)
