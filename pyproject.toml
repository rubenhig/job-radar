[project]
name = "job-radar"
version = "0.1.0"
description = "Radar personal de empleo guiado por el CV: fuentes de calidad, puntuación con Claude y avisos por Telegram"
readme = "README.md"
authors = [
    { name = "Ruben", email = "rhiguerat00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "ats-scrapers>=0.3.0",
    "beautifulsoup4>=4.15.0",
    "cleanco>=2.3",
    "datasette>=0.65.5",
    "fastapi>=0.143.3",
    "feedparser>=6.0.14",
    "html2text>=2025.4.15",
    "httpcloak>=1.7.3",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pypdf>=6.21.0",
    "python-jobspy>=1.3.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlite-utils>=4.2.1",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
job-radar = "job_radar.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
