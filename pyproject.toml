[project]
name = "job-radar"
version = "0.1.0"
description = "Radar personal de empleo guiado por el CV: fuentes de calidad, criba, puntuación con Claude y una web"
readme = "README.md"
authors = [
    { name = "rubenhig", email = "54994920+rubenhig@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ats-scrapers~=0.3.0",  # el conector de InfoJobs usa su método privado _fetch_page: no subir sin probar
    "cleanco>=2.3",
    "fastapi>=0.143.3",
    "html2text>=2025.4.15",
    "httpcloak>=1.7.3",     # opcional en ats-scrapers, imprescindible para InfoJobs
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pypdf>=6.21.0",
    "python-jobspy>=1.3.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlite-utils>=4.2.1",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
job-radar = "job_radar.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datasette>=0.65.5",
    "pytest>=9.1.1",
]
spikes = [
    "feedparser>=6.0.14",
]
